{% if product.is_trend or product.is_top_of_category %}
    <a href="#{% if product.is_top_of_category %}top_of_category{% elif product.is_trend %}trending{% endif %}" aria-label="{% if product.is_top_of_category %}Top of his category{% elif product.is_trend %}Trending{% endif %} button">
        <div class="inline-flex items-center gap-1 py-0.5 px-2 font-semibold rounded-full ring-1 backdrop-blur {% if product.is_top_of_category %}text-orange-700 bg-orange-50/95 ring-orange-200{% elif product.is_trend %}text-rose-600 bg-rose-50/95 ring-rose-200{% endif %}">
            <i class="fa-solid {% if product.is_top_of_category %}fa-medal{% elif product.is_trend %}fa-fire{% endif %} text-[10px]"></i>
            <p class="text-[11px]">{% if product.is_top_of_category %}Top{% elif product.is_trend %}Trending{% endif %}</p>
        </div>
    </a>
{% endif %}
