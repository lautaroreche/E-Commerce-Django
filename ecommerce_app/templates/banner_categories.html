<section class="py-12 md:py-16 bg-white border-t border-slate-200/70">
    <div class="max-w-7xl mx-auto px-4 md:px-8">
        <div class="mb-6 md:mb-8">
            <h2 class="text-xl md:text-2xl font-bold tracking-tight text-slate-900">Explore Categories</h2>
            <p class="text-sm text-slate-500">Jump straight to what you are craving</p>
        </div>

        <div class="grid grid-cols-3 gap-3 md:gap-6">
            {% for cat in categories_menu %}
                <a href="{% url 'filter_category' cat.name|lower %}" class="group relative flex flex-col overflow-hidden rounded-2xl ring-1 ring-slate-200/80 hover:ring-brand-blue transition {% cycle 'bg-brand-blue-50' 'bg-brand-amber-50' 'bg-emerald-50' %}" aria-label="{{ cat.name }} section button">
                    <div class="aspect-[4/3] md:aspect-[16/10] flex items-center justify-center p-3 md:p-6">
                        <img src="{{ cat.image_url }}" alt="{{ cat.name }}" loading="lazy" class="h-full w-auto max-w-full object-contain mix-blend-multiply transition-transform duration-300 group-hover:scale-110 group-hover:-rotate-2">
                    </div>
                    <div class="flex items-center justify-between gap-2 px-3 md:px-5 py-2.5 md:py-4 bg-white/70 backdrop-blur border-t border-white">
                        <p class="font-semibold text-sm md:text-lg text-slate-800 capitalize truncate">{{ cat.name }}</p>
                        <span class="hidden md:grid w-8 h-8 rounded-full bg-white ring-1 ring-slate-200 place-items-center text-slate-500 group-hover:bg-slate-800 group-hover:text-white group-hover:ring-slate-800 transition"><i class="fa-solid fa-arrow-right text-xs"></i></span>
                    </div>
                </a>
            {% endfor %}
        </div>
    </div>
</section>
