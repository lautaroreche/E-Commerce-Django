{% if messages %}
    <div class="fixed z-[60] top-[176px] md:top-[132px] right-4 left-4 sm:left-auto sm:w-80 flex flex-col gap-2" aria-live="polite">
        {% for message in messages %}
            <div class="toast flex items-start gap-3 p-4 rounded-2xl bg-white shadow-xl shadow-slate-900/10 ring-1 transition-opacity duration-500 ease-in {% if message.tags == 'success' %}ring-emerald-200{% elif message.tags == 'warning' %}ring-amber-200{% elif message.tags == 'info' %}ring-sky-200{% else %}ring-red-200{% endif %}" role="status">
                <span class="shrink-0 w-8 h-8 rounded-full grid place-items-center text-white {% if message.tags == 'success' %}bg-emerald-500{% elif message.tags == 'warning' %}bg-amber-500{% elif message.tags == 'info' %}bg-sky-500{% else %}bg-red-500{% endif %}">
                    <i class="fa-solid {% if message.tags == 'success' %}fa-check{% elif message.tags == 'warning' %}fa-exclamation{% elif message.tags == 'info' %}fa-info{% else %}fa-xmark{% endif %} text-sm"></i>
                </span>
                <p class="flex-1 text-sm font-medium text-slate-700 break-words pt-1.5">{{ message }}</p>
                <button type="button" class="toast-close shrink-0 w-6 h-6 grid place-items-center rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-100 cursor-pointer" aria-label="Dismiss message"><i class="fa-solid fa-xmark text-xs"></i></button>
            </div>
        {% endfor %}
    </div>
{% endif %}
