<section id="trending" class="py-12 md:py-16 bg-slate-50 border-t border-slate-200/70 scroll-mt-32">
    <div class="max-w-7xl mx-auto px-4 md:px-8">
        <div class="flex items-end justify-between gap-4 mb-6 md:mb-8">
            <div class="flex items-center gap-3">
                <span class="w-10 h-10 rounded-xl bg-rose-50 text-rose-500 ring-1 ring-rose-100 grid place-items-center"><i class="fa-solid fa-fire"></i></span>
                <div>
                    <h2 class="text-xl md:text-2xl font-bold tracking-tight text-slate-900">Trending Right Now</h2>
                    <p class="text-sm text-slate-500">What everyone is adding to their cart this week</p>
                </div>
            </div>
        </div>
        <div class="flex gap-3 overflow-x-auto snap-x snap-mandatory scrollbar-hide -mx-4 px-4 pb-2 sm:mx-0 sm:px-0 sm:pb-0 sm:grid sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 md:gap-5 sm:overflow-visible">
            {% for product in trending_products %}
                <div class="w-[46%] shrink-0 snap-start sm:w-auto">
                    {% include 'product_card.html' %}
                </div>
            {% empty %}
                <p class="text-slate-400 col-span-full text-center py-8">No trending products at the moment.</p>
            {% endfor %}
        </div>
    </div>
</section>
