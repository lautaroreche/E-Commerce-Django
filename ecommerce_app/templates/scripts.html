<script>
    document.querySelectorAll('a.save-scroll').forEach(link => {
        link.addEventListener('click', function() {
            localStorage.setItem('scrollPosition', window.scrollY);
        });
    });
</script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const scrollPosition = localStorage.getItem('scrollPosition');
        if (scrollPosition) {
            document.documentElement.style.scrollBehavior = 'auto';
            window.scrollTo(0, parseInt(scrollPosition));
            document.documentElement.style.scrollBehavior = '';
            localStorage.removeItem('scrollPosition');
        }
    });
</script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const dismiss = toast => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 500);
        };
        document.querySelectorAll(".toast").forEach(toast => {
            setTimeout(() => dismiss(toast), 5000);
            toast.querySelector('.toast-close')?.addEventListener('click', () => dismiss(toast));
        });
    });
</script>

<script>
    // Product detail gallery: swap the main image when a thumbnail is clicked
    document.querySelectorAll('[data-gallery]').forEach(thumb => {
        thumb.addEventListener('click', () => {
            const main = document.getElementById('main-image');
            if (!main) return;
            main.src = thumb.dataset.gallery;
            document.querySelectorAll('[data-gallery]').forEach(t => {
                t.classList.toggle('border-slate-800', t === thumb);
                t.classList.toggle('border-slate-200', t !== thumb);
            });
        });
    });
</script>

<script>
    const url = new URL(window.location);
    if (url.searchParams.get("status")) {
        url.searchParams.delete("status");
        window.history.replaceState({}, document.title, url.pathname);
    }
</script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        document.body.style.opacity = '1';
    });
</script>
