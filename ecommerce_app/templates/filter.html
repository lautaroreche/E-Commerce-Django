{% extends 'base.html' %}
{% load static %}


{% block title %}{{ category }} | Ragusa ecommerce{% endblock %}

{% block content %}
    <main class="bg-slate-50">
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-8 md:py-12">
            <nav aria-label="Breadcrumb" class="mb-3 text-sm text-slate-400 flex items-center gap-2">
                <a href="{% url 'home' %}" class="hover:text-slate-700 transition-colors">Home</a>
                <i class="fa-solid fa-chevron-right text-[9px]"></i>
                <span class="text-slate-600 font-medium capitalize">{{ category }}</span>
            </nav>
            <div class="flex items-end justify-between gap-4 mb-6 md:mb-8">
                <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight text-slate-900 capitalize">{{ category }}</h1>
                <span class="px-3 py-1 rounded-full bg-white ring-1 ring-slate-200 text-sm font-semibold text-slate-500">{{ products|length }} items</span>
            </div>

            {% include 'product_cards.html' %}
        </div>
    </main>
{% endblock %}
