{% extends 'base.html' %}
{% load static %}


{% block title %}Cart | Ragusa ecommerce{% endblock %}

{% block content %}
    <main class="bg-slate-50">
        <div class="max-w-6xl mx-auto px-4 md:px-8 py-8 md:py-12">
            <div class="flex items-end justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight text-slate-900">Cart</h1>
                    <p class="text-sm text-slate-500 mt-1">Review your products before paying</p>
                </div>
                <a href="{% url 'home' %}" class="hidden sm:flex text-sm font-semibold text-slate-600 hover:text-slate-900 items-center gap-1.5"><i class="fa-solid fa-arrow-left text-xs"></i> Keep shopping</a>
            </div>

            {% include 'product_list.html' %}
        </div>
    </main>
{% endblock %}
