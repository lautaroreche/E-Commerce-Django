{% load static %}


<div class="md:px-10 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-4">
    {% for product in products %}
        <div class="flex flex-col bg-white rounded-xl border border-gray-100 overflow-hidden hover:shadow-md hover:border-gray-200 transition-all duration-200 {% if product.id in cart_products %}ring-2 ring-emerald-400{% endif %}">
            <!-- Tags & Favorite row -->
            <div class="flex items-center {% if product.is_trend or product.is_top_of_category %}justify-between{% else %}justify-end{% endif %} px-3 pt-3">
                {% include 'manage_tags.html' %}
                {% include 'manage_favorites.html' %}
            </div>

            <!-- Image -->
            <a href="{% url 'detail' product.id %}" aria-label="{{ product.name }}" class="flex justify-center items-center px-4 py-3">
                <img src="{{ product.image.url }}" alt="{{ product.name }}" class="h-32 md:h-36 w-full object-contain">
            </a>

            <!-- Info -->
            <div class="flex flex-col flex-1 justify-between p-3 gap-2">
                <div>
                    <p class="text-xs text-gray-400 font-medium capitalize mb-0.5">{{ product.category }}</p>
                    <a href="{% url 'detail' product.id %}" aria-label="{{ product.name }}">
                        <p class="font-semibold text-gray-800 leading-snug truncate">{{ product.name }}</p>
                    </a>
                </div>
                <div class="flex items-center justify-between gap-2 mt-1">
                    <p class="text-base font-bold text-gray-900">€{{ product.price|floatformat:0 }}</p>
                    {% include 'manage_cart_quantity.html' %}
                </div>
            </div>
        </div>
    {% endfor %}
</div>
